<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SensorPanel</title>
<script>
  // Theme stylesheet from panel/themes/, picked by ?theme= (launch.sh passes it; default synthwave).
  // An unknown theme falls back to classic. Written synchronously so the page never renders unstyled.
  const requested = new URLSearchParams(location.search).get("theme") || "synthwave";
  const theme = /^[a-z0-9-]+$/.test(requested) ? requested : "classic";
  document.write(`<link rel="stylesheet" href="/themes/${theme}.css" onerror="this.onerror=null;this.href='/themes/classic.css'">`);
</script>
</head>
<body>
<main>
  <section class="music">
    <div class="bg" id="np-bg"></div>
    <div class="inner">
      <img class="art empty" id="np-art" alt="">
      <div class="meta">
        <div class="np" id="np-player">Now playing</div>
        <div class="song" id="np-title"></div>
        <div class="artist" id="np-artist"></div>
        <div class="album" id="np-album"></div>
        <div class="progress" id="np-progress">
          <span id="np-pos">0:00</span><div class="bar"><div class="fill" id="np-bar"></div></div><span id="np-len">0:00</span>
        </div>
      </div>
    </div>
  </section>

  <div class="sensors">
  <section class="card" style="--accent: var(--cpu)">
    <div class="title">CPU</div>
    <div class="metric">
      <div class="row"><span class="label">Clock</span><span class="sub" id="cpu-freq-sub"></span></div>
      <div class="value"><span id="cpu-freq">–</span><span class="unit">GHz</span></div>
      <div class="bar"><div class="fill" id="cpu-freq-bar"></div></div>
    </div>
    <div class="metric">
      <div class="row"><span class="label">Temp</span><span class="sub"></span></div>
      <div class="value"><span id="cpu-temp">–</span><span class="unit">°C</span></div>
      <div class="bar"><div class="fill" id="cpu-temp-bar"></div></div>
    </div>
  </section>

  <section class="card" style="--accent: var(--gpu)">
    <div class="title">GPU</div>
    <div class="metric">
      <div class="row"><span class="label">Clock</span><span class="sub" id="gpu-freq-sub"></span></div>
      <div class="value"><span id="gpu-freq">–</span><span class="unit">MHz</span></div>
      <div class="bar"><div class="fill" id="gpu-freq-bar"></div></div>
    </div>
    <div class="metric">
      <div class="row"><span class="label">Temp</span><span class="sub" id="gpu-temp-sub"></span></div>
      <div class="value"><span id="gpu-temp">–</span><span class="unit">°C</span></div>
      <div class="bar"><div class="fill" id="gpu-temp-bar"></div></div>
    </div>
  </section>

  <section class="card" style="--accent: var(--ram)">
    <div class="title">RAM</div>
    <div class="metric">
      <div class="row"><span class="label">Used</span><span class="sub" id="ram-sub"></span></div>
      <div class="value"><span id="ram-used">–</span><span class="unit">GB</span></div>
      <div class="bar"><div class="fill" id="ram-bar"></div></div>
    </div>
    <div class="metric">
      <div class="row"><span class="label">Load</span><span class="sub"></span></div>
      <div class="value"><span id="ram-pct">–</span><span class="unit">%</span></div>
      <div class="bar"><div class="fill" id="ram-pct-bar"></div></div>
    </div>
  </section>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const pct = (v, max) => Math.max(0, Math.min(100, (v / max) * 100));
  const setBar = (id, p, color) => {
    const el = $(id); el.style.width = p + "%"; el.style.background = color || ""; el.style.setProperty("--fill", color || "var(--accent)");
  };
  const tempColor = t => t >= 85 ? "var(--hot)" : t >= 70 ? "var(--warm)" : "var(--ok)";
  const loadColor = p => p >= 90 ? "var(--hot)" : p >= 75 ? "var(--warm)" : "";
  const fmt = (v, d = 0) => v == null ? "–" : v.toFixed(d);

  // ---- Now playing ----
  const GRACE_MS = 4000;  // keep the music view briefly through pauses / track changes
  let lastPlaying = 0, music = null, musicAt = 0, artSrc = null;
  const mmss = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

  function renderMusic(m) {
    if (m && m.playing) { lastPlaying = Date.now(); music = m; musicAt = Date.now(); }
    const show = music && Date.now() - lastPlaying < GRACE_MS;
    document.body.classList.toggle("playing", !!show);
    if (!show) return;

    $("np-title").textContent = music.title;
    $("np-artist").textContent = music.artist;
    $("np-album").textContent = music.album;
    $("np-album").style.display = music.album ? "" : "none";
    $("np-player").textContent = "Now playing · " + music.player.replace(/\.instance\d+$/, "");

    if (music.art !== artSrc) {
      artSrc = music.art;
      const img = $("np-art");
      img.classList.toggle("empty", !artSrc);
      if (artSrc) { img.src = artSrc; img.onerror = () => { img.removeAttribute("src"); img.classList.add("empty"); }; }
      else img.removeAttribute("src");
      $("np-bg").style.backgroundImage = artSrc ? `url("${artSrc}")` : "none";
    }

    const hasLen = music.length > 0;
    $("np-progress").style.display = hasLen ? "" : "none";
    if (hasLen) {
      const pos = Math.min(music.length, music.position + (music.playing ? (Date.now() - musicAt) / 1000 : 0));
      $("np-pos").textContent = mmss(pos);
      $("np-len").textContent = mmss(music.length);
      $("np-bar").style.width = pct(pos, music.length) + "%";
    }
  }

  async function tick() {
    try {
      const d = await (await fetch("/api", { cache: "no-store", headers: { "X-Sensor-Panel": "1" } })).json();
      const { cpu, gpu, ram } = d;

      $("cpu-freq").textContent = fmt(cpu.freq / 1000, 2);
      $("cpu-freq-sub").textContent = cpu.freq_peak ? `peak ${fmt(cpu.freq_peak / 1000, 2)} GHz` : "";
      setBar("cpu-freq-bar", pct(cpu.freq, cpu.freq_max || 5000));
      $("cpu-temp").textContent = fmt(cpu.temp);
      setBar("cpu-temp-bar", pct(cpu.temp, 95), tempColor(cpu.temp));

      $("gpu-freq").textContent = fmt(gpu.freq);
      $("gpu-freq-sub").textContent = gpu.load != null ? `load ${gpu.load}%` : "";
      setBar("gpu-freq-bar", pct(gpu.freq, gpu.freq_max || 3000));
      $("gpu-temp").textContent = fmt(gpu.temp);
      $("gpu-temp-sub").textContent = gpu.hotspot != null ? `hotspot ${fmt(gpu.hotspot)}°C` : "";
      setBar("gpu-temp-bar", pct(gpu.hotspot ?? gpu.temp, 110), tempColor(gpu.hotspot != null ? gpu.hotspot - 15 : gpu.temp));

      const rp = pct(ram.used, ram.total);
      $("ram-used").textContent = fmt(ram.used, 1);
      $("ram-sub").textContent = `of ${fmt(ram.total, 1)} GB`;
      $("ram-pct").textContent = fmt(rp);
      setBar("ram-bar", rp, loadColor(rp));
      setBar("ram-pct-bar", rp, loadColor(rp));

      renderMusic(d.music);
    } catch (e) { /* server restarting; try again next tick */ }
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
